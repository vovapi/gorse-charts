apiVersion: v1
kind: Secret
metadata:
  name: {{ template "cloudpirates.names.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "cloudpirates.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "cloudpirates.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if or .Values.secretAnnotations .Values.commonAnnotations }}
  annotations:
      {{- if .Values.secretAnnotations }}
      {{- include "cloudpirates.tplvalues.render" ( dict "value" .Values.secretAnnotations "context" $ ) | nindent 4 }}
      {{- end }}
      {{- if .Values.commonAnnotations }}
      {{- include "cloudpirates.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
      {{- end }}
  {{- end }}
type: Opaque
data:
  dashboard-username: {{ include "gorse.dashboardUsername" . | b64enc | quote }}
  dashboard-password: {{ include "gorse.dashboardPassword" . | b64enc | quote }}
  api-key: {{ include "gorse.apiKey" . | b64enc | quote }}
  openai-auth-token: {{ include "gorse.openaiAuthToken" . | b64enc | quote }}
