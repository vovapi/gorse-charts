{{- if .Values.master.ingress.enabled }}
{{- $ingressApiVersion := include "cloudpirates.capabilities.ingress.apiVersion" . -}}
apiVersion: {{ $ingressApiVersion }}
kind: Ingress
metadata:
  name: {{ printf "%s-dashboard" (include "cloudpirates.fullname" .) }}
  namespace: {{ include "cloudpirates.names.namespace" . | quote }}
  labels: {{- include "cloudpirates.labels" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "cloudpirates.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.master.ingress.certManager }}
    kubernetes.io/tls-acme: "true"
    {{- end }}
    {{- if .Values.master.ingress.annotations }}
    {{- include "cloudpirates.tplvalues.render" (dict "value" .Values.master.ingress.annotations "context" $) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
    {{- include "cloudpirates.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.master.ingress.ingressClassName }}
  ingressClassName: {{ .Values.master.ingress.ingressClassName | quote }}
  {{- end }}
  rules:
    {{- if .Values.master.ingress.hostname }}
    - host: {{ .Values.master.ingress.hostname | quote }}
      http:
        paths:
          - path: {{ .Values.master.ingress.path }}
            {{- if or (eq $ingressApiVersion "networking.k8s.io/v1") (eq $ingressApiVersion "networking.k8s.io/v1beta1") }}
            pathType: {{ .Values.master.ingress.pathType }}
            {{- end }}
            backend: {{- include "cloudpirates.ingress.backend" (dict "serviceName" (printf "%s-master" (include "cloudpirates.fullname" .) ) "servicePort" "http" "context" $)  | nindent 14 }}
          {{- if .Values.master.ingress.extraPaths }}
          {{- toYaml .Values.master.ingress.extraPaths | nindent 10 }}
          {{- end }}
    {{- end }}
    {{- range (coalesce .Values.master.ingress.extraHosts .Values.master.ingress.hosts) }}
    - host: {{ .name | quote }}
      http:
        paths:
          - path: {{ default "/" .path }}
            {{- if or (eq $ingressApiVersion "networking.k8s.io/v1") (eq $ingressApiVersion "networking.k8s.io/v1beta1") }}
            pathType: {{ default "ImplementationSpecific" .pathType }}
            {{- end }}
            backend: {{- include "cloudpirates.ingress.backend" (dict "serviceName" (printf "%s-master" (include "cloudpirates.fullname" .) $) "servicePort" "http" "context" $) | nindent 14 }}
    {{- end }}
    {{- if .Values.master.ingress.extraRules }}
    {{- include "cloudpirates.tplvalues.render" (dict "value" .Values.master.ingress.extraRules "context" $) | nindent 4 }}
    {{- end }}
  {{- if or .Values.master.ingress.tls .Values.master.ingress.extraTls }}
  tls:
     {{- if .Values.master.ingress.tls }}
    - hosts:
        - {{ .Values.master.ingress.hostname | quote }}
      secretName: {{ printf "%s-dashboard-tls" (include "cloudpirates.fullname" .) }}
    {{- end }}
    {{- if .Values.master.ingress.extraTls }}
    {{- include "cloudpirates.tplvalues.render" (dict "value" .Values.master.ingress.extraTls "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
